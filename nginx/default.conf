# 业务流量 upstream（3 worker，无状态 HTTP，无需会话亲和）
upstream django_asgi {
    server web:8000;
}

# MCP 服务 upstream（单 worker，stateful Streamable HTTP 会话在进程内存）
upstream django_mcp {
    server mcp:8001;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # 静态文件 — 通过共享 volume 直接读取
    location /static/ {
        alias /opt/staticfiles/;
        include mime.types;
        types {
            application/wasm wasm;
        }
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # MCP Streamable HTTP → 独立单 worker 服务（匹配 /mcp 与 /mcp/）
    location /mcp {
        proxy_pass http://django_mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept $http_accept;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 其他请求 → 业务 3 worker
    location / {
        proxy_pass http://django_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 30s;
    }
}