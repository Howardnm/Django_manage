{% extends "base.html" %}
{% load static %}

{% block title %}首页{% endblock %}

{% block content %}
<div class="page-header d-print-none">
    <div class="row align-items-center">
        <div class="col">
            <div class="page-pretitle">App Panel</div>
            <h2 class="page-title">项目管理系统</h2>
        </div>
    </div>
</div>

<div class="row row-cards mt-2">
    <div class="col-12">
        <div class="card">
            <div class="card-body text-center py-5">
                <div class="mb-4">
                    <span class="avatar avatar-xl avatar-rounded bg-primary-lt text-primary">
                        <i class="ti ti-atom-2 icon-lg"></i>
                    </span>
                </div>
                <h3 class="card-title mb-2">欢迎使用项目管理系统</h3>
                <p class="text-muted mx-auto" style="max-width: 480px;">
                    本系统集成了项目管理、材料配方管理、试验排产、流程审批、表单管理等功能模块，
                    为研发与生产团队提供一站式协作平台。
                </p>
                <div class="mt-4">
                    <a href="{% url 'personal_workspace' %}" class="btn btn-primary btn-lg">
                        <i class="ti ti-layout-dashboard me-2"></i>进入个人工作台
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
