{% extends "base.html" %}
{% load static %}

{% block title %}排产日历{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/apps/app_trial_production/scheduling_calendar.css' %}">
{% endblock %}

{% block content %}
<div class="page-header d-print-none">
    <div class="row align-items-center">
        <div class="col">
            <div class="page-pretitle">试验排产中心</div>
            <h2 class="page-title">排产日历</h2>
        </div>
    </div>
</div>

<div class="row row-cards mt-2">
    <div class="col-12">
        {# ========== 只读排产日历 ========== #}
        <div class="card">
            <div class="card-header d-flex align-items-center">
                <h3 class="card-title mb-0">
                    <i class="ti ti-calendar me-2 text-blue"></i>挤出排产日历
                </h3>
                <span class="ms-auto small text-muted">
                    <span class="badge badge-dot bg-blue me-1"></span>待挤出
                    <span class="badge badge-dot bg-orange ms-2 me-1"></span>挤出中
                    <span class="badge badge-dot bg-green ms-2 me-1"></span>已挤出
                </span>
            </div>
            <div class="card-body p-2">
                <div id="scheduling-calendar"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    window.EVENTS_URL = "{% url 'trial_scheduling_calendar_events' %}";
    {# 工单详情页 URL，占位 pk=0，点击事件时替换为实际工单 id #}
    window.ORDER_DETAIL_URL = "{% url 'trial_order_detail' 0 %}";
</script>
<script src="{% static 'fullcalendar-6.1.21/package/index.global.min.js' %}"></script>
<script src="{% static 'fullcalendar-6.1.21/package/zh-cn.global.min.js' %}"></script>
<script src="{% static 'js/apps/app_trial_production/extrusion/scheduling_calendar.js' %}"></script>
{% endblock %}
