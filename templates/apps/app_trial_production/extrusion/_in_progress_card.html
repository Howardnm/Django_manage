<div class="col-md-6 col-lg-4 col-xl-3">
    <div class="card border-azure">
        <div class="card-header bg-azure-lt py-2">
            <h3 class="card-title small mb-0">{{ order.code }}</h3>
            <span class="badge bg-azure-lt ms-auto">
                <i class="ti ti-player-play me-1"></i>挤出中
            </span>
        </div>
        <div class="card-body py-2">
            <div class="datagrid datagrid-sm">
                <div class="datagrid-item">
                    <div class="datagrid-title">实验单号</div>
                    <div class="datagrid-content fw-bold">{{ order.trial_code }}</div>
                </div>
                <div class="datagrid-item">
                    <div class="datagrid-title">计划产量</div>
                    <div class="datagrid-content">{{ order.quantity_planned }} kg</div>
                </div>
                <div class="datagrid-item">
                    <div class="datagrid-title">操作员</div>
                    <div class="datagrid-content">
                        {% if order.extrusion_task.operator %}
                        {{ order.extrusion_task.operator.realname }}
                        {% else %}
                        <span class="text-muted">未分配</span>
                        {% endif %}
                    </div>
                </div>
                {% if order.color_task %}
                <div class="datagrid-item">
                    <div class="datagrid-title">配色任务</div>
                    <div class="datagrid-content">
                        <span class="badge {{ order.color_task.status_css_class }}">
                            {{ order.color_task.status_label }}
                        </span>
                    </div>
                </div>
                {% endif %}
            </div>
        </div>
        <div class="card-footer py-2 d-flex gap-2">
            <a href="{% url 'trial_extrusion_record' order.pk %}"
               class="btn btn-sm btn-outline-primary flex-fill">
                <i class="ti ti-pencil me-1"></i>记录参数
            </a>
            <a href="{% url 'trial_extrusion_detail' order.pk %}"
               class="btn btn-sm btn-outline-secondary">
                <i class="ti ti-eye"></i>
            </a>
        </div>
    </div>
</div>
