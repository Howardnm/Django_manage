<div class="modal-header">
    <h5 class="modal-title">{{ page_title }}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form hx-post="{% url 'repo_file_add' repo.id %}" hx-encoding="multipart/form-data">
    {% csrf_token %}
    <div class="modal-body">
        <!-- 1. 进度节点 -->
        <div class="mb-3">
            <label class="form-label">关联进度节点</label>
            {{ form.node }}
            <small class="form-hint">文件将显示在对应的进度节点下。</small>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <!-- 2. 文件类型 -->
                <div class="mb-3">
                    <label class="form-label required">文件类型</label>
                    {{ form.file_type }}
                </div>
            </div>
            <div class="col-lg-4">
                <!-- 3. 版本号 -->
                <div class="mb-3">
                    <label class="form-label required">版本号</label>
                    {{ form.version }}
                </div>
            </div>
        </div>

        <!-- 4. 选择文件 -->
        <div class="mb-3">
            <label class="form-label required">选择文件附件</label>
            {{ form.file }}
            <small class="form-hint text-primary fw-bold">系统将自动提取此文件名作为档案标题，相同文件名的文件将被视为同一份文件的不同版本。</small>
            {% if form.file.errors %}
                <div class="invalid-feedback d-block">{{ form.file.errors.0 }}</div>
            {% endif %}
        </div>

        <!-- 5. 版本变更说明 (原 description) -->
        <div class="mb-3">
            <label class="form-label">版本变更说明</label>
            {{ form.description }}
            <small class="form-hint">简述此版本修改了什么。</small>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-link link-secondary me-auto" data-bs-dismiss="modal">取消</button>
        <button type="submit" class="btn btn-primary">开始上传</button>
    </div>
</form>
