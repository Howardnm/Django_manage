{% extends "base.html" %}
{% load static %}

{% block title %}创建独立注塑任务{% endblock %}

{% block content %}
<div class="page-header d-print-none">
  <div class="container-xl">
    <div class="page-pretitle">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="{% url 'mold_injection:task_list' %}">注塑任务</a></li>
          <li class="breadcrumb-item active">从样品库创建</li>
        </ol>
      </nav>
    </div>
    <h2 class="page-title">从样品库创建独立注塑任务</h2>
  </div>
</div>

<div class="container-xl">
  <form method="post">
    {% csrf_token %}
    <div class="row row-cards">
      <div class="col-lg-8">
        <div class="card">
          <div class="card-header"><h3 class="card-title">物料来源</h3></div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label required">选择待打样颗粒</label>
              <select name="sample_inventory" class="form-select" required>
                <option value="">-- 请选择 --</option>
                {% for sample in available_samples %}
                <option value="{{ sample.pk }}">
                  [{{ sample.trial_code }}] {{ sample.formula.name|default:"未知配方" }} v{{ sample.formula.version|default:"-" }} — {{ sample.quantity }}kg
                </option>
                {% endfor %}
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">关联项目（可选）</label>
              <select name="source_project" class="form-select remote-search" data-model="project">
                <option value="">-- 不关联项目 --</option>
              </select>
              <small class="form-hint">用于后期关联测试结果到项目</small>
            </div>
          </div>
        </div>

        <div class="card mt-3">
          <div class="card-header">
            <h3 class="card-title">模具需求</h3>
            <button type="button" class="btn btn-sm btn-outline-primary ms-auto" id="add-mold-row">
              <i class="ti ti-plus"></i> 添加模具
            </button>
          </div>
          <div class="card-body">
            <div id="mold-rows">
              {# JS 动态添加 #}
            </div>
            <input type="hidden" name="mold_count" id="mold_count" value="0">
          </div>
        </div>

        <div class="card mt-3">
          <div class="card-header"><h3 class="card-title">注塑工艺备注</h3></div>
          <div class="card-body">
            <textarea name="injection_params_note" class="form-control" rows="2" placeholder="注塑温度、压力等工艺参数备注"></textarea>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card">
          <div class="card-body d-grid gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="ti ti-device-desktop-analytics"></i> 创建注塑任务
            </button>
            <a href="{% url 'mold_injection:task_list' %}" class="btn btn-outline-secondary">取消</a>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>

{# 模具行模板 #}
<script type="text/template" id="mold-row-template">
  <div class="row g-2 mb-2 mold-row align-items-end">
    <div class="col-md-5">
      <label class="form-label">模具</label>
      <select name="mold_{IDX}" class="form-select">
        {% for mold in mold_types %}
        <option value="{{ mold.pk }}">[{{ mold.mold_code }}] {{ mold.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">制样数量</label>
      <input type="number" name="qty_{IDX}" class="form-control" value="5" min="1">
    </div>
    <div class="col-md-3">
      <button type="button" class="btn btn-outline-danger remove-mold-row">
        <i class="ti ti-trash"></i>
      </button>
    </div>
  </div>
</script>

{% endblock %}

{% block extra_js %}
<script src="{% static 'js/apps/app_mold_injection/injection/form_inventory.js' %}"></script>
{% endblock %}
