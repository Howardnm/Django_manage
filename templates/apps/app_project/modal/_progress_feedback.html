{% load project_extras %}
<!-- 模态框：客户反馈 -->
<div class="modal-header">
    <h5 class="modal-title">客户干预 / 意见</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<!-- hx-post 指向 feedback 路径 -->
<form hx-post="{% url 'node_feedback' node.id %}"
      hx-target="#modal-content-placeholder"
      hx-swap="innerHTML">
    {% csrf_token %}
    <div class="modal-body">
        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        <input type="hidden" name="feedback_type" value="CHANGE">

        <!-- 1. 意见分类选择 -->
        <div class="mb-3">
            <label class="form-label">意见分类</label>
            <select name="feedback_type_id" class="form-select" required>
                <option value="">-- 请选择意见分类 --</option>
                {% for ft in feedback_types %}
                <option value="{{ ft.pk }}">{{ ft.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- 2. 详细说明 -->
        <div class="mb-3">
            <label class="form-label">详细说明</label>
            <textarea name="remark" class="form-control" rows="3" placeholder="请记录客户的具体反馈内容..." required></textarea>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn me-auto" data-bs-dismiss="modal">取消</button>
        <button type="submit" class="btn btn-warning">提交反馈</button>
    </div>
</form>
