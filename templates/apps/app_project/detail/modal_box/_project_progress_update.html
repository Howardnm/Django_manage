<!-- 模态框：被ProjectNodeUpdateView视图调用 -->
<div class="modal-header">
    <h5 class="modal-title">更新节点: {{ node.get_stage_display }}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<!-- hx-post 指向 update 路径 -->
<form hx-post="{% url 'node_update' node.id %}" hx-swap="none">
    {% csrf_token %}
    <div class="modal-body">
        <div class="mb-3">
            <label class="form-label">状态</label>
            {{ form.status }}
            {% if form.status.errors %}
                {% for error in form.status.errors %}
                    <div class="invalid-feedback d-block">{{ error }}</div>
                {% endfor %}
            {% endif %}
        </div>
        <div class="mb-3">
            <label class="form-label">备注</label>
            {{ form.remark }}
            {% if form.remark.errors %}
                {% for error in form.remark.errors %}
                    <div class="invalid-feedback d-block">{{ error }}</div>
                {% endfor %}
            {% endif %}
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn me-auto" data-bs-dismiss="modal">取消</button>
        <button type="submit" class="btn btn-primary">保存修改</button>
    </div>
</form>
