<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ template.name }} - 表单预览</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'element-plus-2.13.7/dist/index.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; }
        .page { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header h2 { font-size: 20px; font-weight: 600; }
        .header .meta { font-size: 13px; color: #909399; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 24px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .card-desc { font-size: 13px; color: #909399; margin-bottom: 20px; }
        .empty-state { text-align: center; padding: 60px 0; color: #909399; }
    </style>
</head>
<body>

<div class="page">
    <div class="header">
        <div>
            <h2>{{ template.name }}</h2>
        </div>
        <div>
            <button onclick="goBack()" style="padding:8px 16px;border:1px solid #dcdfe6;border-radius:4px;background:#fff;cursor:pointer;margin-right:8px;">返回列表</button>
            {% if request.user.is_superuser %}
            <button onclick="goEdit()" style="padding:8px 20px;border:none;border-radius:4px;background:#409eff;color:#fff;cursor:pointer;">编辑</button>
            {% endif %}
        </div>
    </div>

    <div class="card">
        <div class="card-title">表单预览</div>
        {% if template.description %}
        <div class="card-desc">{{ template.description }}</div>
        {% endif %}
        <div id="form-preview-app">
            <form-create :rule="rule" :option="previewOption" />
        </div>
    </div>
</div>

<script id="form-config-data" type="application/json">{{ form_config_json|safe }}</script>
<script id="form-option-data" type="application/json">{{ form_option_json|safe }}</script>

<script src="{% static 'vue-3.5.33/dist/vue.global.js' %}"></script>
<script src="{% static 'element-plus-2.13.7/dist/index.full.js' %}"></script>
<script src="{% static 'element-ui-3.2.42/dist/form-create.min.js' %}"></script>
<script src="{% static 'designer-3.4.0/dist/index.umd.js' %}"></script>

<script>
    const { createApp } = Vue;

    const app = createApp({
        data() {
            const configEl = document.getElementById('form-config-data');
            const optionEl = document.getElementById('form-option-data');
            let rule = [];
            let option = {};
            try { rule = JSON.parse(configEl.textContent.trim()); } catch(e) {}
            try { option = JSON.parse(optionEl.textContent.trim()); } catch(e) {}

            const previewOption = Object.assign({
                submitBtn: false,
                resetBtn: false,
            }, option, {
                form: Object.assign({}, option.form || {})
            });

            return {
                rule: rule,
                previewOption: previewOption
            };
        }
    });

    app.use(ElementPlus);
    app.use(FcDesigner.formCreate);
    app.mount('#form-preview-app');

    function goBack() {
        window.location.href = '{% url "form_template_list" %}';
    }

    function goEdit() {
        window.location.href = '{% url "form_template_edit" pk=template.pk %}';
    }
</script>

</body>
</html>
