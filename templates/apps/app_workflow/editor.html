{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'bpmn-js/core-18.15.0/dist/assets/diagram-js.css' %}">
<link rel="stylesheet" href="{% static 'bpmn-js/core-18.15.0/dist/assets/bpmn-font/css/bpmn.css' %}">
<link rel="stylesheet" href="{% static 'bpmn-js/properties-panel-3.41.2/assets/properties-panel.css' %}">
<link rel="stylesheet" href="{% static 'codemirror-5.65.21/lib/codemirror.css' %}">
<link rel="stylesheet" href="{% static 'codemirror-5.65.21/theme/dracula.css' %}">
<link rel="stylesheet" href="{% static 'codemirror-5.65.21/addon/fold/foldgutter.css' %}">
<style>
    .bpmn-editor-container {
        height: calc(100vh - 64px);
        margin: -1.25rem;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .editor-header {
        background: #fff;
        border-bottom: 1px solid #e6e8e9;
        padding: 0.75rem 1.25rem;
        z-index: 100;
    }
    .editor-main { flex: 1; display: flex; overflow: hidden; }
    #canvas { flex: 1; background-color: #fcfcfc; }
    #properties-panel { width: 380px; border-left: 1px solid #e6e8e9; background: #fff; overflow-y: auto; }
    .bjs-powered-by { display: none; }

    .xml-editor-wrapper {
        display: none;
        flex: 1;
        width: 0;
        min-width: 0;
        height: 100%;
        overflow: hidden;
    }
    .xml-editor-wrapper .CodeMirror {
        height: 100% !important;
        width: 100% !important;
        max-width: 100%;
        font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.5;
    }
    .xml-editor-wrapper .CodeMirror pre.CodeMirror-line,
    .xml-editor-wrapper .CodeMirror pre.CodeMirror-line-like {
        background: transparent;
    }
    /* 亮色滚动条 */
    .xml-editor-wrapper .CodeMirror-vscrollbar::-webkit-scrollbar,
    .xml-editor-wrapper .CodeMirror-hscrollbar::-webkit-scrollbar {
        width: 10px;
        height: 10px;
    }
    .xml-editor-wrapper .CodeMirror-vscrollbar::-webkit-scrollbar-track,
    .xml-editor-wrapper .CodeMirror-hscrollbar::-webkit-scrollbar-track {
        background: #282a36;
    }
    .xml-editor-wrapper .CodeMirror-vscrollbar::-webkit-scrollbar-thumb,
    .xml-editor-wrapper .CodeMirror-hscrollbar::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 5px;
    }
    .xml-editor-wrapper .CodeMirror-vscrollbar::-webkit-scrollbar-thumb:hover,
    .xml-editor-wrapper .CodeMirror-hscrollbar::-webkit-scrollbar-thumb:hover {
        background: #777;
    }
    .xml-editor-wrapper .CodeMirror-scroll {
        margin-right: 0;
        padding-right: 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="bpmn-editor-container">
    <div class="editor-header">
        <div class="row align-items-center g-3">
            <div class="col-auto">
                <a href="{% url 'workflow_definition_list' %}" class="btn btn-ghost-secondary btn-icon" title="返回列表">
                    <i class="ti ti-arrow-left"></i>
                </a>
            </div>
            <div class="col-md-3">
                <div class="input-icon">
                    <span class="input-icon-addon"><i class="ti ti-signature"></i></span>
                    <input type="text" id="workflow-name" class="form-control" value="{{ definition.name|default:'未命名流程' }}">
                </div>
            </div>
            <div class="col">
                <div class="input-icon">
                    <span class="input-icon-addon"><i class="ti ti-align-left"></i></span>
                    <input type="text" id="workflow-description" class="form-control" value="{{ definition.description|default:'' }}" placeholder="输入描述...">
                </div>
            </div>
            <div class="col-auto">
                <div class="btn-group" id="view-toggle">
                    <button class="btn btn-outline-secondary active" data-view="graphic">
                        <i class="ti ti-chart-bubble me-1"></i>图形
                    </button>
                    <button class="btn btn-outline-secondary" data-view="xml">
                        <i class="ti ti-code me-1"></i>XML 源码
                    </button>
                </div>
            </div>
            <div class="col-auto">
                <button class="btn btn-primary px-4" id="btn-save">
                    <i class="ti ti-device-floppy me-2"></i><strong>保存流程</strong>
                </button>
            </div>
        </div>
    </div>
    <div class="editor-main">
        <div id="canvas"></div>
        <div id="properties-panel"></div>
        <div class="xml-editor-wrapper" id="xml-editor-wrapper">
            <textarea id="xml-editor"></textarea>
        </div>
    </div>
</div>

<!-- 使用 script type="text/plain" 存放原始 XML，这是最安全的隔离方式 -->
<script id="bpmn-xml-data" type="text/plain">{{ xml_content|safe }}</script>

<input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
{% endblock %}

{% block extra_js %}
<script src="{% static 'bpmn-js/core-18.15.0/dist/bpmn-modeler.development.js' %}"></script>
<script src="{% static 'bpmn-js/bpmn-js-properties-panel-5.54.0/dist/bpmn-js-properties-panel.umd.js' %}"></script>
<script src="{% static 'bpmn-js/bpmn_chinese.js' %}"></script>
<script src="{% static 'codemirror-5.65.21/lib/codemirror.js' %}"></script>
<script src="{% static 'codemirror-5.65.21/mode/xml/xml.js' %}"></script>
<script src="{% static 'codemirror-5.65.21/addon/fold/foldcode.js' %}"></script>
<script src="{% static 'codemirror-5.65.21/addon/fold/foldgutter.js' %}"></script>
<script src="{% static 'codemirror-5.65.21/addon/fold/xml-fold.js' %}"></script>
<script src="{% static 'codemirror-5.65.21/addon/edit/matchbrackets.js' %}"></script>
<script src="{% static 'codemirror-5.65.21/addon/edit/closetag.js' %}"></script>

<script>
    function customTranslate(template, replacements) {
        replacements = replacements || {};
        const translations = window.bpmnChineseTranslations || {};
        let translated = translations[template] || translations[template.trim()] || template;
        return translated.replace(/{([^}]+)}/g, function(_, key) {
            return translations[replacements[key]] || replacements[key] || '{' + key + '}';
        });
    }

    async function initEditor() {
        // 加载 camunda 描述符
        let camundaModdleDescriptor = {};
        try {
            const response = await fetch("{% static 'bpmn-js/camunda-bpmn-moddle-7.0.1/resources/camunda.json' %}");
            camundaModdleDescriptor = await response.json();
        } catch (e) { console.error(e); }

        const adapter = window.BpmnJSPropertiesPanel;
        const additionalModules = [{ translate: ['value', customTranslate] }];

        if (adapter) {
            if (adapter.BpmnPropertiesPanelModule) additionalModules.push(adapter.BpmnPropertiesPanelModule);
            if (adapter.BpmnPropertiesProviderModule) additionalModules.push(adapter.BpmnPropertiesProviderModule);
            if (adapter.CamundaPlatformPropertiesProviderModule) additionalModules.push(adapter.CamundaPlatformPropertiesProviderModule);
        }

        const bpmnModeler = new BpmnJS({
            container: '#canvas',
            propertiesPanel: { parent: '#properties-panel' },
            additionalModules: additionalModules,
            moddleExtensions: { camunda: camundaModdleDescriptor }
        });

        // 初始化 CodeMirror
        const xmlTextarea = document.getElementById('xml-editor');
        const cm = CodeMirror.fromTextArea(xmlTextarea, {
            lineNumbers: true,
            mode: 'xml',
            theme: 'dracula',
            matchBrackets: true,
            autoCloseTags: true,
            foldGutter: true,
            gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
            tabSize: 2,
            indentUnit: 2,
            lineWrapping: true
        });

        // 从 script 标签中读取原始 XML
        const initialXml = document.getElementById('bpmn-xml-data').innerHTML.trim();
        let cachedXml = initialXml || '';

        function loadDiagram(xml) {
            return bpmnModeler.importXML(xml).then(() => {
                cachedXml = xml;
                try {
                    bpmnModeler.get('canvas').zoom('fit-viewport');
                } catch (e) {
                    // zoom 可能因 diagram 尺寸未就绪而失败，不影响导入
                }
            });
        }

        if (initialXml && initialXml.length > 10) {
            cm.setValue(initialXml);
            loadDiagram(initialXml).catch(err => {
                console.error('BPMN 导入失败:', err);
                alert('流程图加载失败，请检查XML格式是否正确。');
            });
        } else {
            const defaultXml = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" id="Definitions_1" targetNamespace="http://bpmn.io/schema/bpmn">
  <bpmn:process id="Process_1" isExecutable="true">
    <bpmn:startEvent id="StartEvent_1" />
  </bpmn:process>
  <bpmndi:BPMNDiagram id="BPMNDiagram_1">
    <bpmndi:BPMNPlane id="BPMNPlane_1" bpmnElement="Process_1">
      <bpmndi:BPMNShape id="_BPMNShape_StartEvent_2" bpmnElement="StartEvent_1">
        <dc:Bounds x="173" y="102" width="36" height="36" />
      </bpmndi:BPMNShape>
    </bpmndi:BPMNPlane>
  </bpmndi:BPMNDiagram>
</bpmn:definitions>`;
            cachedXml = defaultXml;
            cm.setValue(defaultXml);
            loadDiagram(defaultXml).catch(err => console.error('Failed to load default XML', err));
        }

        document.getElementById('btn-save').addEventListener('click', async () => {
            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            try {
                if (document.getElementById('xml-editor-wrapper').style.display !== 'none') {
                    await switchToGraphic();
                }
                const { xml } = await bpmnModeler.saveXML({ format: true });
                const response = await fetch("{% url 'workflow_save' %}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value },
                    body: JSON.stringify({
                        pk: "{{ definition.pk|default:'' }}" || null,
                        name: document.getElementById('workflow-name').value,
                        description: document.getElementById('workflow-description').value,
                        xml: xml
                    })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    if (!"{{ definition.pk }}") window.location.href = "{% url 'workflow_editor_create' %}" + result.pk + '/';
                    else alert('流程已保存！');
                }
            } catch (err) { console.error(err); } finally { btn.disabled = false; }
        });

        // --- 图形 / XML 视图切换 ---
        const wrapper = document.getElementById('xml-editor-wrapper');
        const canvas = document.getElementById('canvas');
        const panel = document.getElementById('properties-panel');

        async function switchToGraphic() {
            const xml = cm.getValue().trim();
            if (!xml) { alert('XML 为空，无法渲染流程图。'); throw new Error('empty xml'); }
            if (xml === cachedXml) {
                canvas.style.display = '';
                panel.style.display = '';
                wrapper.style.display = 'none';
                return;
            }
            try {
                await loadDiagram(xml);
                canvas.style.display = '';
                panel.style.display = '';
                wrapper.style.display = 'none';
            } catch (e) {
                console.error(e);
                alert('XML 解析失败，请检查格式。\n' + e.message);
                throw e;
            }
        }

        async function switchToXml() {
            try {
                const result = await bpmnModeler.saveXML({ format: true });
                if (result && result.xml) cachedXml = result.xml;
            } catch (e) {
                // 获取失败则使用缓存
            }
            cm.setValue(cachedXml);
            canvas.style.display = 'none';
            panel.style.display = 'none';
            wrapper.style.display = 'flex';
            cm.refresh();
        }

        document.querySelectorAll('#view-toggle button').forEach(btn => {
            btn.addEventListener('click', async function() {
                const view = this.getAttribute('data-view');
                document.querySelectorAll('#view-toggle button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                if (view === 'xml') {
                    await switchToXml();
                } else {
                    try { await switchToGraphic(); } catch(e) { /* error already alerted */ }
                }
            });
        });
    }

    window.addEventListener('load', initEditor);
</script>
{% endblock %}
