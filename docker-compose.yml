version: "3.9"

services:
  # ── PostgreSQL 16 + pgvector ──
  db:
    image: pgvector/pgvector:pg16
    container_name: django-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: django_manage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d django_manage"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django 应用 ──
  web:
    image: ${DOCKERHUB_USERNAME:-django-manage}/django-manage:latest
    build: .
    container_name: django-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Core security — 必须在 .env 中配置
      - SECRET_KEY=${SECRET_KEY:-}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      # CSRF
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      # Database (fixed for Docker network)
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=django_manage
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-}
      # Registration
      - REGISTER_INVITE_CODE=${REGISTER_INVITE_CODE:-}
      # Email
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      # django-axes
      - AXES_FAILURE_LIMIT=${AXES_FAILURE_LIMIT:-5}
      - AXES_COOLOFF_TIME=${AXES_COOLOFF_TIME:-0.0833}
      - AXES_RESET_ON_SUCCESS=${AXES_RESET_ON_SUCCESS:-True}
      # Internal API integration
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      - WEBHOOK_SECRET_KEY=${WEBHOOK_SECRET_KEY:-}
      - CATALOG_WEBHOOK_URL=${CATALOG_WEBHOOK_URL:-}
      - REMOTE_API_BASE_URL=${REMOTE_API_BASE_URL:-}
      # SAP RFC
      - SAP_LIB_PATH=/opt/sap_nwrfcsdk/lib
      - SAP_HOST=${SAP_HOST:-}
      - SAP_SYSNR=${SAP_SYSNR:-00}
      - SAP_CLIENT=${SAP_CLIENT:-400}
      - SAP_USER=${SAP_USER:-}
      - SAP_PASSWORD=${SAP_PASSWORD:-}
      - SAP_LANG=${SAP_LANG:-ZH}
      - SAP_MAX_IDLE_SECONDS=${SAP_MAX_IDLE_SECONDS:-300}
      - SAP_MAX_RETRIES=${SAP_MAX_RETRIES:-3}
      - SAP_RETRY_DELAY=${SAP_RETRY_DELAY:-1.0}
      # Superuser auto-creation
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      # MCP
      - MCP_API_KEY=${MCP_API_KEY:-}
    volumes:
      - staticfiles:/app/staticfiles
      - logs:/app/logs
      - upload_files:/app/upload_files
    entrypoint: ["/bin/bash", "/app/docker-entrypoint.sh"]
    command: >
      gunicorn Django_manage.asgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --worker-class uvicorn.workers.UvicornWorker
      --timeout 120
      --max-requests 1000

  # ── Nginx 反向代理 ──
  nginx:
    image: nginx:1.27-alpine
    container_name: django-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/opt/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  staticfiles:
  logs:
  upload_files:
