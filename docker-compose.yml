version: "3.9"

services:
  # ── PostgreSQL 16 + pgvector ──
  db:
    image: pgvector/pgvector:pg16
    container_name: django-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: django_manage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-django_manage_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d django_manage"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django 应用 ──
  web:
    image: ${DOCKERHUB_USERNAME:-django-manage}/django-manage:latest
    build: .
    container_name: django-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SAP_LIB_PATH=/opt/sap_nwrfcsdk/lib
      - MCP_API_KEY=${MCP_API_KEY:-}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=django_manage
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-django_manage_secret}
    volumes:
      - staticfiles:/app/staticfiles
      - logs:/app/logs
      - upload_files:/app/upload_files
    entrypoint: ["/bin/bash", "/app/docker-entrypoint.sh"]
    command: >
      gunicorn Django_manage.asgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --worker-class uvicorn.workers.UvicornWorker
      --timeout 120
      --max-requests 1000

  # ── Nginx 反向代理 ──
  nginx:
    image: nginx:1.27-alpine
    container_name: django-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/opt/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  staticfiles:
  logs:
  upload_files:
